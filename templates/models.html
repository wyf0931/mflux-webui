{% extends "base.html" %}
{% block title %}模型库 - mflux WebUI{% endblock %}
{% block content %}
<section x-data="modelLibrary" class="mx-auto max-w-[1400px]">
  <div x-show="error" x-cloak role="alert" class="alert alert-error mb-5" x-text="error"></div>
  <section x-show="tasks.length" x-cloak class="mb-8"><h2 class="mb-3 text-lg font-semibold">下载任务</h2><div class="grid gap-3"><template x-for="task in tasks" :key="task.repoId"><div class="card border border-base-300 bg-base-100"><div class="card-body p-4"><p class="font-medium break-all" x-text="task.repoId"></p><p class="text-sm text-base-content/60" x-text="taskLabel(task)"></p><button x-show="task.status === 'downloading'" @click="cancel(task.repoId)" class="btn btn-outline btn-sm w-fit">取消</button></div></div></template></div></section>
  <section><div class="flex items-start justify-between gap-4"><div><h1 class="text-xl font-semibold">推荐模型</h1><p class="mt-1 text-sm text-base-content/60">4-bit 优先，下载到 Hugging Face 本地缓存，不会覆盖已有权重。</p></div><button @click="load" class="btn btn-square btn-outline btn-sm" aria-label="刷新模型库">↻</button></div><div id="catalog" class="mt-4 grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3"><template x-for="model in catalogItems" :key="model.repoId"><div class="card border border-base-300 bg-base-100 shadow-sm"><div class="card-body p-5"><div class="flex justify-between gap-3"><div class="min-w-0"><p class="text-xs text-base-content/60" x-text="model.family"></p><h3 class="mt-2 font-semibold break-words" x-text="model.name"></h3></div><span class="badge badge-sm shrink-0" :class="model.installed ? 'badge-success' : 'badge-ghost'" x-text="model.installed ? '已安装' : '未安装'"></span></div><p class="mt-4 text-sm text-base-content/60" x-text="model.sizeGB + ' GB · 默认 ' + model.steps + ' 步 · 文生图、图生图'"></p><div class="card-actions mt-5 items-center justify-between"><a class="link link-hover text-sm" :href="'https://huggingface.co/' + model.repoId" target="_blank">在 HF 查看 ↗</a><button x-show="!model.installed" @click="download(model.repoId)" class="btn btn-primary btn-sm">下载</button></div></div></div></template></div></section>
  <section class="mt-10"><h2 class="text-xl font-semibold">已安装</h2><p class="mt-1 text-sm text-base-content/60" x-text="'已安装 ' + installedItems.length + ' 个可用模型'"></p><div id="installed" class="mt-4 grid grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-3"><template x-for="model in installedItems" :key="model.repoId"><div class="card border border-base-300 bg-base-100 shadow-sm"><div class="card-body p-5"><div class="flex justify-between gap-3"><div class="min-w-0"><p class="text-xs text-base-content/60" x-text="model.family"></p><h3 class="mt-2 font-semibold break-words" x-text="model.repoId"></h3></div><span class="badge badge-success badge-sm">已安装</span></div><p class="mt-4 text-sm text-base-content/60" x-text="(model.size / 1024 / 1024 / 1024).toFixed(1) + ' GB · ' + model.files + ' 个缓存文件'"></p><p class="text-xs text-base-content/60" x-text="'最近访问：' + (model.lastAccessed || '—')"></p></div></div></template></div><div x-show="!installedItems.length" x-cloak class="alert mt-4">尚未安装可用的 mflux 图像模型。</div></section>
</section>
{% endblock %}
