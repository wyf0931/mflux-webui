<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>{% block title %}mflux WebUI{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Fonts: Syne for headings, DM Sans for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                        display: ['Syne', 'sans-serif'],
                    },
                    colors: {
                        bg: {
                            primary: 'var(--bg-primary)',
                            secondary: 'var(--bg-secondary)',
                            tertiary: 'var(--bg-tertiary)',
                            elevated: 'var(--bg-elevated)',
                            'input-bg': 'var(--input-bg)',
                        },
                        text: {
                            primary: 'var(--text-primary)',
                            secondary: 'var(--text-secondary)',
                            muted: 'var(--text-muted)',
                            'input-text': 'var(--input-text)',
                        },
                        border: {
                            DEFAULT: 'var(--border-color)',
                            light: 'var(--border-light)',
                        },
                        primary: {
                            DEFAULT: 'var(--accent-primary)',
                            hover: 'var(--accent-hover)',
                            glow: 'var(--accent-glow)',
                        },
                    },
                    boxShadow: {
                        'sm': 'var(--shadow-sm)',
                        'md': 'var(--shadow-md)',
                        'lg': 'var(--shadow-lg)',
                    },
                }
            }
        }
    </script>

    <style>
        :root {
            /* Light Theme - Studio Bright */
            --bg-primary: #f8f9fc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f2f8;
            --bg-elevated: #ffffff;
            --text-primary: #1a1d23;
            --text-secondary: #2d333d;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --border-light: #f3f4f6;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --nav-bg: #1a1d23;
            --nav-hover: #2d333d;
            --accent-primary: #3b82f6;
            --accent-hover: #2563eb;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --input-bg: #ffffff;
            --input-text: #24292f;
        }

        [data-theme="dark"] {
            /* Dark Theme - Deep Studio */
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1c2128;
            --bg-elevated: #1f242c;
            --text-primary: #f0f6fc;
            --text-secondary: #e6edf3;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --border-light: #21262d;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
            --nav-bg: #010409;
            --nav-hover: #161b22;
            --accent-primary: #1f242c;
            --accent-hover: #2d333d;
            --accent-glow: rgba(31, 36, 44, 0.5);
            --input-bg: #0d1117;
            --input-text: #c9d1d9;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            color: var(--text-secondary);
        }

        /* Form inputs - ensure visibility in dark mode */
        input,
        select,
        textarea {
            color: var(--input-text) !important;
            background-color: var(--input-bg) !important;
        }

        input::placeholder,
        textarea::placeholder {
            color: var(--text-muted) !important;
            opacity: 0.8;
        }

        /* Fix for select dropdown options in dark mode */
        select option {
            background-color: var(--bg-secondary) !important;
            color: var(--input-text) !important;
        }

        /* Focus states for form elements */
        input:focus,
        select:focus,
        textarea:focus {
            color: var(--input-text) !important;
            background-color: var(--input-bg) !important;
        }

        /* Custom Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .animate-fadeIn {
            animation: fadeIn 0.4s ease;
        }

        .animate-slideUp {
            animation: slideUp 0.4s ease;
        }

        .animate-scaleIn {
            animation: scaleIn 0.3s ease backwards;
        }

        .animate-slideInRight {
            animation: slideInRight 0.3s ease;
        }

        .animate-fadeInScale {
            animation: fadeInScale 0.3s ease;
        }

        /* Loading Spinner */
        .loading-spinner {
            position: relative;
        }

        .loading-spinner::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* Filter Tag Button */
        .filter-tag {
            background-color: var(--bg-tertiary);
            color: var(--text-muted);
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
        }

        .filter-tag:hover {
            background-color: var(--bg-elevated);
            color: var(--text-secondary);
        }

        .filter-tag.active {
            background-color: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
            box-shadow: 0 2px 8px var(--accent-glow);
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-primary), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Navigation Styles */
        .navbar {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
        }

        /* Button text color in dark mode */
        [data-theme="dark"] button[class*="bg-primary"],
        [data-theme="dark"] a[class*="bg-primary"] {
            color: #ffffff !important;
        }

        [data-theme="dark"] button[class*="bg-primary"]:hover,
        [data-theme="dark"] a[class*="bg-primary"]:hover {
            color: #ffffff !important;
        }

        /* Hamburger button - always dark background with light icon */
        .hamburger {
            background-color: var(--nav-bg) !important;
            color: #f0f6fc !important;
        }
        .hamburger:hover {
            border-color: var(--accent-hover) !important;
        }
    </style>
</head>
<body>
    <script>
        // Apply saved theme before page renders to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <!-- Navigation -->
    <nav class="navbar sticky top-0 z-50">
        <div class="max-w-[1400px] mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="nav-brand text-xl font-bold font-display text-text-primary hover:opacity-80 transition-opacity">
                <span class="gradient-text">mflux WebUI</span>
            </a>

            <!-- Desktop Menu -->
            <ul class="hidden md:flex items-center gap-1">
                <li>
                    <a href="/" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-text-muted hover:text-text-primary hover:bg-nav-hover transition-all {% if request.endpoint == 'index' %}text-primary !bg-primary-glow{% endif %}">
                        <span class="mr-1.5">✨</span>生图
                    </a>
                </li>
                <li>
                    <a href="/gallery" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-text-muted hover:text-text-primary hover:bg-nav-hover transition-all {% if request.endpoint == 'gallery' %}text-primary !bg-primary-glow{% endif %}">
                        <span class="mr-1.5">🎨</span>画廊
                    </a>
                </li>
                <li>
                    <a href="/models" class="nav-link px-4 py-2 rounded-lg text-sm font-medium text-text-muted hover:text-text-primary hover:bg-nav-hover transition-all {% if request.endpoint == 'models' %}text-primary !bg-primary-glow{% endif %}">
                        <span class="mr-1.5">📦</span>本地模型
                    </a>
                </li>
                <li>
                    <button onclick="toggleTheme()" class="theme-toggle px-3 py-2 rounded-lg text-xl border-border hover:border-primary transition-all" title="切换主题">
                        <span id="themeIcon">🌙</span>
                    </button>
                </li>
            </ul>

            <!-- Mobile: Only Hamburger and Theme Toggle -->
            <div class="md:hidden flex items-center gap-2">
                <button onclick="toggleTheme()" class="theme-toggle px-3 py-2 rounded-lg text-xl border-border hover:border-primary transition-all" title="切换主题">
                    <span id="themeIconMobile">🌙</span>
                </button>
                <button onclick="toggleMenu()" class="hamburger p-2 border border-border rounded-lg bg-bg-primary text-text-primary hover:text-primary hover:border-primary transition-all" title="菜单">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Mobile Menu -->
        <ul id="navMenu" class="md:hidden hidden border-t border-border-light bg-nav-bg">
            <li class="border-t border-border-light">
                <a href="/" class="block px-6 py-4 text-text-muted hover:text-text-primary hover:bg-nav-hover {% if request.endpoint == 'index' %}text-primary{% endif %}">
                    <span class="mr-2">✨</span>生图
                </a>
            </li>
            <li class="border-t border-border-light">
                <a href="/gallery" class="block px-6 py-4 text-text-muted hover:text-text-primary hover:bg-nav-hover {% if request.endpoint == 'gallery' %}text-primary{% endif %}">
                    <span class="mr-2">🎨</span>画廊
                </a>
            </li>
            <li class="border-t border-border-light">
                <a href="/models" class="block px-6 py-4 text-text-muted hover:text-text-primary hover:bg-nav-hover {% if request.endpoint == 'models' %}text-primary{% endif %}">
                    <span class="mr-2">📦</span>本地模型
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="max-w-[1400px] mx-auto px-6 py-8 animate-fadeIn">
        {% block content %}{% endblock %}
    </main>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('hidden');
        }

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            if (newTheme === 'dark') {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.removeAttribute('data-theme');
            }

            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = theme === 'dark' ? '☀️' : '🌙';
            const themeIcon = document.getElementById('themeIcon');
            const themeIconMobile = document.getElementById('themeIconMobile');
            if (themeIcon) themeIcon.textContent = icon;
            if (themeIconMobile) themeIconMobile.textContent = icon;
        }

        // Initialize theme icon on page load
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.addEventListener('DOMContentLoaded', function() {
                updateThemeIcon(isDark ? 'dark' : 'light');
            });
        })();

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('navMenu');
            const hamburger = document.querySelector('.hamburger');
            if (!menu.contains(event.target) && !hamburger.contains(event.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
