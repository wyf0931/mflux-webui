{% extends "base.html" %}
{% block title %}生图 - mflux WebUI{% endblock %}
{% block content %}
<section x-data="generationPage" class="mx-auto max-w-[1400px]"><header class="mb-4"><h1 class="text-xl font-semibold">图像生成</h1></header><div class="grid grid-cols-1 gap-8 lg:grid-cols-2">
  <form x-ref="form" @submit.prevent="submit" class="card border border-base-300 bg-base-100 shadow-sm" enctype="multipart/form-data"><div class="card-body gap-6">
    <label class="form-control"><span class="label-text font-medium">模型</span><select x-model="form.modelId" name="modelId" class="select select-bordered mt-2 w-full"><template x-for="model in models" :key="model.repoId"><option :value="model.repoId" x-text="model.name"></option></template><option x-show="!models.length" value="">请先在模型库下载模型</option></select><span class="label-text-alt mt-2 text-base-content/60" x-text="selectedModel ? `${selectedModel.family} · ${selectedModel.sizeGB.toFixed(1)} GB · 默认 ${selectedModel.steps} 步` : ''"></span></label>
    <label class="form-control"><span class="label-text font-medium">提示词</span><textarea x-model="form.prompt" name="prompt" rows="5" placeholder="描述你想要生成的图像..." required class="textarea textarea-bordered mt-2 w-full"></textarea></label>
    <div class="grid grid-cols-1 gap-4 md:grid-cols-4"><label class="form-control"><span class="label-text">比例</span><select x-model="preset" @change="applyPreset" class="select select-bordered mt-2 w-full"><template x-for="option in presets" :key="option.id"><option :value="option.id" x-text="option.icon + '  ' + option.ratio"></option></template><option value="custom">⌗  自定义</option></select></label><label class="form-control"><span class="label-text">宽度</span><input x-model.number="form.width" @input="syncPreset" name="width" type="number" min="256" max="2048" step="16" required class="input input-bordered mt-2 w-full"></label><label class="form-control"><span class="label-text">高度</span><input x-model.number="form.height" @input="syncPreset" name="height" type="number" min="256" max="2048" step="16" required class="input input-bordered mt-2 w-full"></label><label class="form-control"><span class="label-text">步数</span><input x-model.number="form.steps" name="steps" type="number" min="1" max="100" class="input input-bordered mt-2 w-full"></label></div>
    <button type="button" @click="showAdvanced = !showAdvanced" class="btn btn-ghost btn-sm w-fit px-0" x-text="showAdvanced ? '收起高级选项' : '显示高级选项'"></button>
    <section x-show="showAdvanced" x-cloak class="rounded-box border border-base-300 bg-base-200 p-5"><div class="grid grid-cols-1 gap-4 sm:grid-cols-2"><label class="form-control"><span class="label-text">引导系数（可选）</span><input x-model="form.guidance" name="guidance" placeholder="默认 1.0" type="number" step="0.5" min="0" max="20" class="input input-bordered mt-2 w-full"><span class="label-text-alt mt-2">Krea 2 Turbo 推荐使用 1.0。</span></label><label class="form-control"><span class="label-text">随机种子（可选）</span><input x-model="form.seed" name="seed" placeholder="自动" type="number" class="input input-bordered mt-2 w-full"></label></div><div class="mt-5 border-t border-base-300 pt-5"><h2 class="font-semibold">参考图（可选）</h2><p class="mt-1 text-sm text-base-content/60">上传图片后进入文 + 图生图模式。</p><label class="btn btn-outline mt-4"><input x-ref="image" @change="chooseImage($event)" name="image" type="file" accept="image/png,image/jpeg,image/webp" class="sr-only"><span x-text="imageName"></span></label><p class="mt-2 text-xs text-base-content/60">支持 PNG、JPG、WebP。</p><label x-show="imageName !== '选择参考图'" class="form-control mt-5"><span class="label-text">参考图强度（0–1）</span><input x-model.number="form.imageStrength" name="imageStrength" type="number" min="0" max="1" step="0.05" class="input input-bordered mt-2 w-full"><span class="label-text-alt mt-2">默认 0.35；值越高，保留原图越多。</span></label></div></section>
    <button type="submit" :disabled="submitting || !form.modelId" class="btn btn-primary btn-lg w-full" x-text="submitting ? '生成中...' : '生成图像 ✨'"></button>
  </div></form>
  <section x-show="result" x-cloak class="card border border-base-300 bg-base-100 shadow-sm"><div class="card-body p-0"><div class="flex items-center justify-between border-b border-base-300 px-6 py-5"><h2 class="text-xl font-semibold">生成结果</h2><span class="badge badge-success">完成</span></div><div class="bg-base-200 p-6"><img :src="result ? `/static/images/${result.filename}` : ''" alt="生成结果" class="mx-auto max-h-[600px] max-w-full rounded-box"></div><div class="grid gap-2 p-5 text-sm"><p>文件：<span x-text="result?.filename"></span></p><p>耗时：<span x-text="result ? `${result.duration.toFixed(1)} 秒` : ''"></span></p></div></div></section>
</div><div x-show="error" x-cloak role="alert" class="alert alert-error fixed right-6 bottom-6 z-50 w-auto max-w-md shadow-lg" x-text="error"></div></section>
{% endblock %}
