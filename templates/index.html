{% extends "base.html" %}
{% block title %}生图 - mflux WebUI{% endblock %}
{% block content %}
<div class="max-w-[1200px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8 lg:items-start">
    <form id="generateForm" class="bg-bg-secondary border border-border rounded-2xl p-8 shadow-md" enctype="multipart/form-data">
        <div class="mb-8"><h1 class="text-2xl font-bold">Krea 2 Turbo</h1><p class="text-text-muted mt-2 text-sm">mflux-community/krea-2-turbo-mflux-q4</p></div>
        <label class="mb-6 font-medium text-text-secondary text-sm block">提示词<textarea name="prompt" rows="5" placeholder="描述你想要生成的图像..." required class="w-full mt-2 px-4 py-3 border border-border rounded-lg bg-input-bg resize-y"></textarea></label>
        <div class="mb-6 grid grid-cols-2 gap-4">
            <label class="flex flex-col gap-2 text-sm text-text-secondary">宽度<input name="width" type="number" value="768" min="256" max="2048" step="16" required class="px-4 py-3 border border-border rounded-lg bg-input-bg"></label>
            <label class="flex flex-col gap-2 text-sm text-text-secondary">高度<input name="height" type="number" value="1376" min="256" max="2048" step="16" required class="px-4 py-3 border border-border rounded-lg bg-input-bg"></label>
        </div>
        <label class="mb-6 flex flex-col gap-2 text-sm text-text-secondary">步数<input name="steps" type="number" value="8" min="1" max="100" class="px-4 py-3 border border-border rounded-lg bg-input-bg"></label>
        <button type="button" id="advancedToggle" class="text-sm text-text-secondary hover:underline">显示高级选项</button>
        <section id="advancedOptions" class="hidden mt-5 p-4 rounded-xl bg-bg-tertiary border border-border-light">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <label class="flex flex-col gap-2 text-sm text-text-secondary">引导系数（可选）<input name="guidance" type="number" placeholder="默认 1.0" step="0.5" min="0" max="20" class="px-4 py-3 border border-border rounded-lg bg-input-bg"><span class="text-xs text-text-muted">Krea 2 Turbo 推荐使用 1.0。</span></label>
                <label class="flex flex-col gap-2 text-sm text-text-secondary">随机种子（可选）<input name="seed" type="number" placeholder="自动" class="px-4 py-3 border border-border rounded-lg bg-input-bg"></label>
            </div>
            <div class="mt-5 pt-5 border-t border-border-light"><h2 class="font-semibold">参考图（可选）</h2><p class="text-xs text-text-muted mt-1">上传图片后进入文 + 图生图模式。</p><div class="mt-3"><label for="imageInput" class="inline-flex max-w-full items-center gap-2 px-4 py-3 rounded-lg border border-border bg-input-bg text-sm text-text-secondary cursor-pointer hover:border-primary focus-within:ring-2 focus-within:ring-primary/30 transition-colors"><svg class="shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span id="imageInputLabel" class="truncate">选择参考图</span><input id="imageInput" name="image" type="file" accept="image/png,image/jpeg,image/webp" class="sr-only"></label><p class="text-xs text-text-muted mt-2">支持 PNG、JPG、WebP。</p></div><label id="strengthOption" class="hidden mt-4 flex flex-col gap-2 text-sm text-text-secondary">参考图强度（0–1）<input name="imageStrength" type="number" value="0.35" min="0" max="1" step="0.05" class="px-4 py-3 border border-border rounded-lg bg-input-bg"><span class="text-xs text-text-muted">默认 0.35；值越高，保留原图越多。</span></label></div>
        </section>
        <button type="submit" id="generateBtn" class="w-full mt-6 px-8 py-3 bg-primary text-white rounded-lg font-semibold disabled:opacity-50">生成图像 ✨</button>
    </form>
    <section id="result" class="hidden bg-bg-secondary border border-border rounded-2xl overflow-hidden shadow-md"><div class="px-6 py-5 border-b border-border-light flex justify-between"><h2 class="text-lg font-semibold">生成结果</h2><span class="text-primary">完成</span></div><div class="p-6 bg-bg-tertiary"><img id="resultImage" alt="生成结果" class="max-w-full max-h-[600px] mx-auto rounded-xl"></div><div class="p-5 grid gap-3 text-sm"><p>文件：<span id="resultFilename"></span></p><p>耗时：<span id="resultDuration"></span></p></div></section>
</div>
<div id="error" class="fixed bottom-6 right-6 hidden bg-red-500 text-white px-6 py-4 rounded-xl shadow-lg"></div>
<script>
const form = document.getElementById('generateForm'); const button = document.getElementById('generateBtn'); const errorDiv = document.getElementById('error');
const advancedToggle = document.getElementById('advancedToggle'); const advancedOptions = document.getElementById('advancedOptions'); const imageInput = document.getElementById('imageInput'); const imageInputLabel = document.getElementById('imageInputLabel'); const strengthOption = document.getElementById('strengthOption');
advancedToggle.addEventListener('click', () => { const hidden = advancedOptions.classList.toggle('hidden'); advancedToggle.textContent = hidden ? '显示高级选项' : '收起高级选项'; });
imageInput.addEventListener('change', () => { const hasImage = imageInput.files.length > 0; strengthOption.classList.toggle('hidden', !hasImage); imageInputLabel.textContent = hasImage ? imageInput.files[0].name : '选择参考图'; });
form.addEventListener('submit', async event => { event.preventDefault(); errorDiv.classList.add('hidden'); button.disabled = true; button.textContent = '生成中...'; const data = new FormData(form); if (!imageInput.files.length) { data.delete('image'); data.delete('imageStrength'); } if (!data.get('guidance')) data.delete('guidance'); if (!data.get('seed')) data.delete('seed'); try { const response = await fetch('/api/generate', {method: 'POST', body: data}); const result = await response.json(); if (!response.ok) throw new Error(result.error || '生成失败'); document.getElementById('resultImage').src = '/static/images/' + result.filename; document.getElementById('resultFilename').textContent = result.filename; document.getElementById('resultDuration').textContent = result.duration.toFixed(1) + ' 秒'; document.getElementById('result').classList.remove('hidden'); } catch (error) { errorDiv.textContent = error.message; errorDiv.classList.remove('hidden'); } finally { button.disabled = false; button.textContent = '生成图像 ✨'; } });
</script>
{% endblock %}
