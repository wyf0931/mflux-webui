<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="data:,">
    <title>{% block title %}mflux WebUI{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body x-data="theme" class="bg-base-200 text-base-content">
    <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');</script>
    <div class="navbar sticky top-0 z-50 border-b border-white/10 bg-neutral px-4 text-neutral-content shadow-sm md:px-8">
        <div class="navbar-start"><a href="/" class="text-xl font-bold"><span class="gradient-text">mflux WebUI</span></a></div>
        <div class="navbar-end gap-1">
            <div class="hidden items-center gap-1 md:flex">
                <a href="/" class="btn btn-ghost btn-sm text-neutral-content hover:bg-white/10 {% if request.endpoint == 'index' %}bg-white/15 hover:bg-white/15{% endif %}">✨ 生图</a>
                <a href="/gallery" class="btn btn-ghost btn-sm text-neutral-content hover:bg-white/10 {% if request.endpoint == 'gallery' %}bg-white/15 hover:bg-white/15{% endif %}">🎨 画廊</a>
                <a href="/queue" class="btn btn-ghost btn-sm text-neutral-content hover:bg-white/10 {% if request.endpoint == 'generation_queue' %}bg-white/15 hover:bg-white/15{% endif %}">⏳ 队列</a>
                <a href="/models" class="btn btn-ghost btn-sm text-neutral-content hover:bg-white/10 {% if request.endpoint == 'models' %}bg-white/15 hover:bg-white/15{% endif %}">📦 模型库</a>
            </div>
            <button @click="toggle" class="btn btn-ghost btn-square btn-sm text-neutral-content hover:bg-white/10" aria-label="切换主题"><span x-text="current === 'dark' ? '☀️' : '🌙'">🌙</span></button>
            <div class="dropdown dropdown-end md:hidden"><button tabindex="0" class="btn btn-ghost btn-square btn-sm text-neutral-content hover:bg-white/10" aria-label="菜单"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><ul tabindex="0" class="menu dropdown-content z-[1] mt-3 w-44 rounded-box border border-base-300 bg-base-100 p-2 shadow"><li><a href="/">✨ 生图</a></li><li><a href="/gallery">🎨 画廊</a></li><li><a href="/queue">⏳ 队列</a></li><li><a href="/models">📦 模型库</a></li></ul></div>
        </div>
    </div>
    <main class="mx-auto max-w-[1400px] px-4 py-8 md:px-8">{% block content %}{% endblock %}</main>
    <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
