{% extends "base.html" %}
{% block title %}生成队列 - mflux WebUI{% endblock %}
{% block content %}
<section x-data="queuePage" class="mx-auto max-w-[1400px]">
  <header class="mb-6 flex flex-wrap items-end justify-between gap-3"><div><h1 class="text-xl font-semibold">生成队列</h1><p class="mt-1 text-sm text-base-content/60">当前等待 <span x-text="queueLength"></span> 个任务；进行中的任务会每秒自动刷新。</p></div><button @click="load" class="btn btn-outline btn-sm">刷新</button></header>
  <div class="overflow-x-auto rounded-box border border-base-300 bg-base-100 shadow-sm"><table class="table"><thead><tr><th>提交时间</th><th>状态</th><th>提示词</th><th>模型与参数</th><th>队列信息</th><th>结果</th></tr></thead><tbody><template x-for="task in tasks" :key="task.taskId"><tr><td class="whitespace-nowrap text-sm" x-text="formatDateTime(task.createdAt)"></td><td><span class="badge" :class="statusClass(task.status)" x-text="statusLabel(task.status)"></span></td><td class="max-w-xs whitespace-normal text-sm" x-text="task.prompt"></td><td class="whitespace-nowrap text-sm"><p x-text="task.modelId"></p><p class="text-base-content/60" x-text="`${task.width}×${task.height} · ${task.steps || '默认'} 步`"></p></td><td class="whitespace-nowrap text-sm"><template x-if="task.status === 'pending'"><span x-text="`第 ${task.position} 个 · ${etaLabel(task.etaSeconds)}`"></span></template><template x-if="task.status === 'running'"><span>正在使用 GPU</span></template><template x-if="['succeeded', 'failed'].includes(task.status)"><span x-text="task.duration ? formatDuration(task.duration) : '—'"></span></template></td><td class="max-w-xs whitespace-normal text-sm"><a x-show="task.filename" :href="`/static/images/${task.filename}`" target="_blank" class="link link-primary">查看图片</a><span x-show="task.error" class="text-error" x-text="task.error"></span></td></tr></template><tr x-show="!tasks.length"><td colspan="6" class="py-12 text-center text-base-content/60">暂无生成任务</td></tr></tbody></table></div>
  <div x-show="error" x-cloak role="alert" class="alert alert-error fixed right-6 bottom-6 z-50 w-auto max-w-md shadow-lg" x-text="error"></div>
</section>
{% endblock %}
